
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُشَكِّل الحروف الذكي - إعداد الأديب سامح النجار</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070a14;
            --container-bg: #121a2f;
            --text-color: #f1f5f9;
            --label-color: #cbd5e1;
            --textarea-bg: #0b1226;
            --textarea-border: #263455;
            --textarea-text: #f1f5f9;
            --note-color: #94a3b8;
            --border: #25304f;
            --primary: #10b981;
        }
        [data-theme="light"] {
            --bg-color: #f3f6fb;
            --container-bg: #ffffff;
            --text-color: #0f172a;
            --label-color: #334155;
            --textarea-bg: #fbfdff;
            --textarea-border: #cbd5e1;
            --textarea-text: #0f172a;
            --note-color: #64748b;
            --border: #e2e8f0;
        }
        [data-theme="white"] {
            --bg-color: #ffffff;
            --container-bg: #ffffff;
            --text-color: #111827;
            --label-color: #1f2937;
            --textarea-bg: #ffffff;
            --textarea-border: #d1d5db;
            --textarea-text: #111827;
            --note-color: #6b7280;
            --border: #e5e7eb;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            transition: all 0.3s;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--container-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h2 { margin:0; font-weight:700; }
        .theme-toggle {
            background: var(--textarea-bg);
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            font-family: 'Cairo', sans-serif;
            transition: all 0.2s;
        }
        .theme-toggle:hover { transform: scale(1.05); }
        .section-label {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--label-color);
            display: block;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            min-height: 260px;
            padding: 14px;
            font-size: 19px;
            font-family: 'Amiri', serif;
            line-height: 2.2;
            border: 1px solid var(--textarea-border);
            border-radius: 12px;
            resize: vertical;
            box-sizing: border-box;
            background-color: var(--textarea-bg);
            color: var(--textarea-text);
            transition: all 0.3s;
        }
        textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .btn-group { display: flex; gap: 10px; margin: 15px 0; }
        button { padding: 12px 20px; font-size: 14px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; font-family: 'Cairo', sans-serif; transition: all 0.2s; }
        .btn-process { background: linear-gradient(135deg,#10b981,#059669); color: white; flex: 2; }
        .btn-process:hover { transform: translateY(-1px); }
        .btn-clear { background: #ef4444; color: white; flex: 1; }
        .btn-copy, .btn-save { background: #3b82f6; color: white; flex: 1; }
        .footer-actions { display: flex; gap: 10px; margin-top: 10px; }
        .footer { text-align: center; margin-top: 25px; padding-top: 18px; border-top: 1px solid var(--border); font-size: 14px; font-weight: bold; color: var(--label-color); line-height: 2; }
        .stats { font-size: 12px; color: var(--note-color); display: flex; gap: 15px; margin-bottom: 10px; }
    </style>
</head>
<body data-theme="dark">
<div class="container">
    <div class="header-flex">
        <h2>مُشَكِّل الحروف الذكي</h2>
        <button class="theme-toggle" id="themeBtn" onclick="cycleTheme()">🌙 داكن</button>
    </div>
    
    <div class="stats">
        <span>الكلمات: <b id="wordCount">0</b></span>
        <span>الحروف: <b id="charCount">0</b></span>
    </div>

    <label class="section-label">النص المراد تشكيله (المدخلات):</label>
    <textarea id="inputText" placeholder="اكتب أو الصق النص هنا..." oninput="updateStats()" onfocus="this.placeholder=''" onblur="this.placeholder='اكتب أو الصق النص هنا...'"></textarea>
    
    <div class="btn-group">
        <button class="btn-process" onclick="runDiacritization()">✨ تشكيل النص</button>
        <button class="btn-clear" onclick="clearFields()">مسح الكل</button>
    </div>

    <label class="section-label">النص المشكول (المخرجات):</label>
    <textarea id="outputText" readonly placeholder="ستظهر النتيجة هنا..."></textarea>
    
    <div class="footer-actions">
        <button class="btn-copy" onclick="copyOutput()">⎘ نسخ</button>
        <button class="btn-save" onclick="saveToFile()">💾 حفظ TXT</button>
    </div>

    <div class="footer">
        برنامج من إعداد الأديب سامح النجار بالاشتراك مع Google Gemini و Meta AI
    </div>
</div>

<script>
    let currentTheme = localStorage.getItem('tashkeel-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);
    document.body.setAttribute('data-theme', currentTheme);
    updateThemeBtn();

    function updateThemeBtn() {
        const btn = document.getElementById('themeBtn');
        if (currentTheme === 'dark') btn.textContent = '🌙 داكن';
        else if (currentTheme === 'light') btn.textContent = '🔵 أزرق فاتح';
        else btn.textContent = '⚪ أبيض ناصع';
    }

    function cycleTheme() {
        currentTheme = currentTheme === 'dark' ? 'light' : currentTheme === 'light' ? 'white' : 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
        document.body.setAttribute('data-theme', currentTheme);
        localStorage.setItem('tashkeel-theme', currentTheme);
        updateThemeBtn();
    }

    function updateStats() {
        const text = document.getElementById('inputText').value;
        document.getElementById('wordCount').textContent = text.trim() ? text.trim().split(/\s+/).length : 0;
        document.getElementById('charCount').textContent = text.replace(/\s/g,'').length;
    }

    const fixedWords = new Map([
        ["من","مِنْ"],["إلى","إِلَى"],["عن","عَنْ"],["على","عَلَى"],["في","فِي"],
        ["حتى","حَتَّى"],["ثم","ثُمَّ"],["أو","أَوْ"],["أم","أَمْ"],["بل","بَلْ"],["لكن","لَكِنْ"],
        ["إلا","إِلَّا"],["سوف","سَوْفَ"],["قد","قَدْ"],["لقد","لَقَدْ"],
        ["يا","يَا"],["أيها","أَيُّهَا"],["كل","كُلّ"],
        ["هذا","هَذَا"],["هذه","هَذِهِ"],["هؤلاء","هَؤُلَاءِ"],["ذلك","ذَلِكَ"],["تلك","تِلْكَ"],
        ["الذي","الَّذِي"],["التي","الَّتِي"],["الذين","الَّذِينَ"],
        ["أنا","أَنَا"],["نحن","نَحْنُ"],["أنت","أَنْتَ"],["هو","هُوَ"],["هي","هِيَ"]
    ]);

    const TASHKEEL_REGEX = /[\u064B-\u0652\u0640]/g;
    function stripTashkeel(s){ return s.replace(TASHKEEL_REGEX, ""); }
    const DELIM_SPLIT_REGEX = /([\s.,،;!؟:()\[\]{}"'«»–—\n]+)/;

    function processRuleEngine(word){
        if(!word) return word;
        let t = word;
        t = t.replace(/ال([تثدذرزسشصضطظلن])/g, "ال$1\u0651\u064E");
        t = t.replace(/ال([أبجحخعغفقكهمويءؤئ])/g, "الْ$1");
        t = t.replace(/([^أإآا\s])ا/g, "$1َا");
        t = t.replace(/([^أإآا\s])ى/g, "$1َى");
        t = t.replace(/([^أإآا\s])و/g, "$1ُو");
        t = t.replace(/([^أإآا\s])ي/g, "$1ِي");
        t = t.replace(/([^أإآا\s])ة/g, "$1َة");
        return t;
    }

    function diacritizeText(inputStr){
        const stripped = stripTashkeel(inputStr);
        const tokens = stripped.split(DELIM_SPLIT_REGEX);
        return tokens.map(token => {
            if(!token || DELIM_SPLIT_REGEX.test(token)) return token;
            const clean = token.trim();
            if(!clean) return token;
            if(fixedWords.has(clean)) return fixedWords.get(clean);
            return processRuleEngine(token);
        }).join("");
    }

    function runDiacritization(){
        const input = document.getElementById('inputText').value;
        if(!input.trim()){ alert("الرجاء إدخال نص أولاً!"); return; }
        document.getElementById('outputText').value = diacritizeText(input);
    }
    function clearFields(){ 
        document.getElementById('inputText').value=''; 
        document.getElementById('outputText').value=''; 
        updateStats(); 
        document.getElementById('inputText').focus();
        document.getElementById('inputText').placeholder='اكتب أو الصق النص هنا...';
    }
    function copyOutput(){
        const out = document.getElementById('outputText');
        if(!out.value.trim()){ alert("لا توجد نتيجة"); return; }
        out.select(); document.execCommand('copy');
        alert("✓ تم النسخ");
    }
    function saveToFile(){
        const result = document.getElementById('outputText').value;
        if(!result.trim()){ alert("لا توجد مخرجات"); return; }
        const blob = new Blob(["\uFEFF"+result], {type:'text/plain;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download='tashkeel_'+new Date().toISOString().slice(0,10)+'.txt';
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    }
</script>
</body>
</html>
