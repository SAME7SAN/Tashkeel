<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُشَكِّل الحروف الذكي (المحرك الصرفي والإملائي)</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --container-bg: #ffffff;
            --text-color: #2c3e50;
            --label-color: #34495e;
            --textarea-bg: #fafafa;
            --textarea-border: #cbd5e1;
            --textarea-text: #2c3e50;
            --note-color: #64748b;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-color: #f8fafc;
            --label-color: #e2e8f0;
            --textarea-bg: #0f172a;
            --textarea-border: #334155;
            --textarea-text: #f8fafc;
            --note-color: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--container-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h2 {
            color: var(--text-color);
            margin: 0;
        }
        .theme-toggle {
            background-color: #64748b;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .theme-toggle:hover { background-color: #475569; }

        .section-label {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--label-color);
            display: block;
        }
        textarea {
            width: 100%;
            height: 140px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid var(--textarea-border);
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            background-color: var(--textarea-bg);
            color: var(--textarea-text);
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-process {
            background-color: #10b981;
            color: white;
            flex: 2;
        }
        .btn-process:hover { background-color: #059669; }
        
        .btn-clear {
            background-color: #ef4444;
            color: white;
            flex: 1;
        }
        .btn-clear:hover { background-color: #dc2626; }

        .btn-save {
            background-color: #3b82f6;
            color: white;
            width: 100%;
            margin-top: 10px;
        }
        .btn-save:hover { background-color: #2563eb; }
        .note {
            font-size: 13px;
            color: var(--note-color);
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div class="header-flex">
        <h2>مشكل الحروف الذكي</h2>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 وضع الظلام / النور</button>
    </div>
    
    <label class="section-label">النص المراد تشكيله (المدخلات):</label>
    <textarea id="inputText" placeholder="اكتب أو الصق النص هنا..."></textarea>
    
    <div class="btn-group">
        <button class="btn-process" onclick="runDiacritization()">✨ تشكيل النص بالقواعد المحدثة</button>
        <button class="btn-clear" onclick="clearFields()">مسح الكل</button>
    </div>

    <label class="section-label">النص المشكول (المخرجات):</label>
    <textarea id="outputText" readonly placeholder="ستظهر النتيجة هنا..."></textarea>
    
    <button class="btn-save" onclick="saveToFile()">💾 حفظ المخرجات في ملف نصي (.txt)</button>
    <div class="note"> دعم الوضع الداكن والفاتح .</div>
</div>

<script>
    // تبديل المظهر بين الداكن والفاتح
    function toggleTheme() {
        const body = document.body;
        if (body.getAttribute('data-theme') === 'light') {
            body.setAttribute('data-theme', 'dark');
        } else {
            body.setAttribute('data-theme', 'light');
        }
    }

    // قاموس الكلمات المبنية والحروف الثابتة
    const fixedWords = {
        "من": "مِنْ", "إلى": "إِلَى", "عن": "عَنْ", "على": "عَلَى", "في": "فِي", 
        "حتى": "حَتَّى", "رب": "رُبَّ", "خلا": "خَلَا", "عدا": "عَدَا", "حاشا": "حَاشَا", 
        "ثم": "ثُمَّ", "أو": "أَوْ", "أم": "أَمْ", "بل": "بَلْ", "لكن": "لَكِنْ", 
        "إلا": "إِلَّا", "سوف": "سَوْفَ", "قد": "قَدْ", "لقد": "لَقَدْ",
        
        "يا": "يَا", "أيا": "أَيَا", "هيا": "هَيَا", "أي": "أَيْ", "أيها": "أَيُّهَا", "أيتها": "أَيَّتُهَا",
        
        "كل": "كُلّ", "إليك": "إِلَيْكَ", "عليك": "عَلَيْكَ", 
        "له": "لَهُ", "لها": "لَهَا", "لهم": "لَهُمْ", "لهن": "لَهُنَّ",

        "هذا": "هَذَا", "هذه": "هَذِهِ", "هؤلاء": "هَؤُلَاءِ", "هذان": "هَذَانِ", 
        "هذين": "هَذَيْنِ", "هاتان": "هَاتَانِ", "هاتين": "هَاتَيْنِ", "ذلك": "ذَلِكَ", 
        "تلك": "تِلْكَ", "أولئك": "أُولَئِكَ", "هنا": "هُنَا", "هناك": "هُنَاكَ", "هنالك": "هُنَالِكَ",
        
        "الذي": "الَّذِي", "التي": "الَّتِي", "الذين": "الَّذِينَ", "اللائي": "اللَّائِي", 
        "اللاتي": "اللَّاتِي", "اللواتي": "اللَّوَاتِي", "اللذان": "اللَّذَانِ", "اللذين": "اللَّلذَيْنِ", 
        "اللتان": "اللَّتَانِ", "اللتين": "اللَّتَيْنِ",
        
        "أنا": "أَنَا", "نحن": "نَحْنُ", "أنت": "أَنْتَ", "أنتِ": "أنتِ", "أنتما": "أَنْتُمَا", 
        "أنتم": "أَنْتُمْ", "أنتن": "أَنْتُنَّ", "هو": "هُوَ", "هي": "هِيَ", "هما": "هُمَا", 
        "هم": "هُمْ", "هن": "هُنَّ", "إياي": "إِيَّايَ", "إيانا": "إِيَّانَا", "إياك": "إِيَّاكَ", 
        "إياكِ": "إِيَّاكِ", "إياكما": "إِيَّاكُمَا", "إياكم": "إِيَّاكُمْ", "إياكن": "إِيَّاكُنَّ", 
        "إياه": "إِيَّاهُ", "إياها": "إِيَّاهَا", "إياهما": "إِيَّاهُمَا", "إياهم": "إِيَّاهُمْ", "إياهن": "إياهن"
    };

    const sunLetters = "تثدذرزسشصضطظلن";
    const moonLetters = "أبجحخعغفقكهمويئؤء";

    function diacritizeText(text) {
        // 1. تطبيق قاعدة اللام الشمسية والقمرية المبسطة
        const simpleAlPattern = /([أإآا])(ل)([تثدذرزسشصضطظلنأبجحخعغفقكهمويئؤء])([\u0600-\u06FF]*)/g;
        
        text = text.replace(simpleAlPattern, (match, alef, lam, nextChar, rest) => {
            if (sunLetters.includes(nextChar)) {
                return `${alef}${lam}${nextChar}ّ${rest}`;
            } else if (moonLetters.includes(nextChar)) {
                return `${alef}${lam}ْ${nextChar}${rest}`;
            }
            return match;
        });

        // 2. تطبيق قاموس الكلمات المبنية
        let words = text.split(/(\s+|[.,،;!؟:()\[{}""«»–—\n])/);
        for (let i = 0; i < words.length; i++) {
            let cleanWord = words[i].trim();
            if (fixedWords[cleanWord]) {
                words[i] = words[i].replace(cleanWord, fixedWords[cleanWord]);
            }
        }
        text = words.join('');

        // 3. الهمزات الثابتة (مع استثناء همزة الألف الأولى من المد العشوائي)
        text = text.replaceAll('ئ', 'ئِ');

        // 4. المد بالألف (مستثنى الحرف الذي يسبقه همزة أ، إ، آ تفادياً لأخطاء مثل الأوزان)
        // البحث عن الحروف العادية قبل الألف (عدا الهمزات أ، إ، آ في بداية الكلمة أو المتبوعة مباشرة)
        const maddAlifPattern = /([^أإآ\s])(ا|ى)/g;
        text = text.replace(maddAlifPattern, '$1َ$2');

        // 5. المد بالواو (باستثناء ما يسبقه همزة على الألف)
        const maddWawPattern = /([^أإآ\s])و/g;
        text = text.replace(maddWawPattern, '$1ُو');

        // 6. المد بالياء (باستثناء ما يسبقه همزة على الألف)
        const maddYaPattern = /([^أإآ\s])ي/g;
        text = text.replace(maddYaPattern, '$1ِي');

        // 7. التاء المربوطة
        const taaPattern = /([بجحخعغفقكهمونسطذرزشصضتثدئؤإأآلرىو])ة/g;
        text = text.replace(taaPattern, '$1َة');

        return text;
    }

    function runDiacritization() {
        const input = document.getElementById('inputText').value;
        if (!input.trim()) {
            alert("الرجاء إدخال نص أولاً لتشكيله!");
            return;
        }
        const result = diacritizeText(input);
        document.getElementById('outputText').value = result;
    }

    function clearFields() {
        document.getElementById('inputText').value = '';
        document.getElementById('outputText').value = '';
    }

    function saveToFile() {
        const result = document.getElementById('outputText').value;
        if (!result.trim()) {
            alert("لا توجد مخرجات لحفظها!");
            return;
        }
        
        const blob = new Blob([result], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'tashkeel_output.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
